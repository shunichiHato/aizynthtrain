[tool.poetry]
name = "aizynthtrain"
version = "0.3.0"
description = "Tools to train reaction predictions models for AiZynthFinder"
authors = ["Genheden, Samuel <samuel.genheden@astrazeneca.com>"]
license = "Apache 2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pillow = "^12.0.0"
numpy= "^1.23.5"
jupytext = "^1.3.3"
papermill = "2.6.0"
nbconvert = "^7.2.3"
onnx = "^1.13.1"
tf2onnx = "^1.17.0"
urllib3 = "<2.0"
aizynthfinder = { version = "^4.4.1", extras = ["all", "tf"] }
reaction-utils = "^1.9.3"
onnxruntime = "^1.23.0"
protobuf = ">=5.28.0"
ploomber-engine = "0.0.33"
torch = "^2.2.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
